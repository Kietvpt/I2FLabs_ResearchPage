<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .mark-dark { display: none; }
    .mark-light { display: block; }
    @media (prefers-color-scheme: dark) {
      .mark-dark { display: block; }
      .mark-light { display: none; }
    }
  </style>
  <image class="mark-light" href="data:image/png;base64," width="128" height="128"/>
  <image class="mark-dark" href="data:image/png;base64," width="128" height="128"/>
</svg>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I2FLabs Research — Human–AI Collaborative Research</title>
    <meta
      name="description"
      content="Thư viện báo cáo nghiên cứu, kiến trúc hệ thống và thực nghiệm đồng sáng tạo giữa con người và AI tại I2FLabs."

    <!-- Browser & System Favicons (Adaptive Dark & Light Mode + Google Search 48x48/ICO) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- SearchPage / OpenGraph & Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="I2FLabs Research" />
    <meta property="og:title" content="I2FLabs Research — Human–AI Collaborative Research" />

      property="og:description"
      content="Thư viện báo cáo nghiên cứu, kiến trúc hệ thống và thực nghiệm đồng sáng tạo giữa con người và AI tại I2FLabs."
    />

      name="twitter:description"
      content="Thư viện báo cáo nghiên cứu, kiến trúc hệ thống và thực nghiệm đồng sáng tạo giữa con người và AI tại I2FLabs."
    />
    <meta name="twitter:image" content="/og-searchpage.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('i2flabs-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-foreground antialiased selection:bg-accent/20 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
